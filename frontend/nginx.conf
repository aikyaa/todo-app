server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Limit referrer info sent to other origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict what the page can load and where it can connect
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:;" always;

    # React router — serve index.html for all routes so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
