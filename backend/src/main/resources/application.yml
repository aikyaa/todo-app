server:
  port: 8080

spring:
  datasource:
    url:               ${SPRING_DATASOURCE_URL}
    username:          ${DB_USERNAME}
    password:          ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update  # creates tables on first run, preserves data on restart
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
  jwt:
    secret: ${JWT_SECRET:todoai-default-secret-key-change-in-production-must-be-long}
    expiration-ms: 86400000 # 24 hours

# Azure Service Bus — set these as environment variables, never hardcode connection strings
azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
    queue-name: ${AZURE_SERVICEBUS_QUEUE_NAME:task-queue}

