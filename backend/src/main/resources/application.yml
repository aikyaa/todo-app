server:
  port: 8080

spring:
  config:
    # URL is resolved from AZURE_KEYVAULT_URL env var at import time.
    # "optional:" means: if KV is unreachable or env var is unset, skip gracefully.
    # In prod: AZURE_KEYVAULT_URL=https://todo-app-kv.vault.azure.net/
    # Locally: unset AZURE_KEYVAULT_URL to skip KV and use env var fallbacks below.
    import: "optional:azure-keyvault:${AZURE_KEYVAULT_URL:}"
  datasource:
    url:               ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tododb}
    username:          ${DB_USERNAME:postgres}
    # Password is fetched from Key Vault in DataSourceConfig at startup
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Tries Key Vault secret "jwt-secret" first (when AZURE_KEYVAULT_URL is set),
    # then falls back to JWT_SECRET env var, then to the insecure default.
    secret: ${jwt.secret:${JWT_SECRET:todoai-default-secret-key-change-in-production-must-be-long}}
    expiration-ms: 10800000
  enrich-secret: ${enrich.secret:${ENRICH_SECRET:local-enrich-secret}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

azure:
  servicebus:
    # Tries Key Vault secret "servicebus-connection-string" first, then falls back to env var
    connection-string: ${servicebus.connection.string:${AZURE_SERVICEBUS_CONNECTION_STRING:}}
    queue-name: ${AZURE_SERVICEBUS_QUEUE_NAME:task-queue}
