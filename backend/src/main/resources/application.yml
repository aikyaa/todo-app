server:
  port: 8080

spring:
  datasource:
    url:               ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tododb}
    username:          ${DB_USERNAME:postgres}
    password:          ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:todoai-default-secret-key-change-in-production-must-be-long}
    expiration-ms: 10800000
  enrich-secret: ${ENRICH_SECRET:local-enrich-secret}

azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
    queue-name: ${AZURE_SERVICEBUS_QUEUE_NAME:task-queue}
