server:
  port: 8080

spring:
  datasource:
    url:               jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1 #delay -1 retains data even when connections are lost
    driver-class-name: org.h2.Driver
    username:          sa
    password:
  h2:
    console:
      enabled: true       # browse DB at http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop #create at start destroy at end
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs              # raw OpenAPI JSON spec available at http://localhost:8080/api-docs
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI available at http://localhost:8080/swagger-ui.html
    operations-sorter: method    # sort endpoints by HTTP method (GET, POST, PUT, DELETE)
    tags-sorter: alpha           # sort tag groups alphabetically
    display-request-duration: true  # show how long each request took in Swagger UI
  show-actuator: false           # don't expose Spring Actuator endpoints in the docs
